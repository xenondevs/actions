name: setup-nu
description: Installs a hash pinned nushell release

inputs:
  version:
    description: Nushell version, for example 0.116.1
    required: true
  sha256:
    description: SHA-256 of nu-<version>-x86_64-unknown-linux-gnu.tar.gz from the release's SHA256SUMS
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        NU_VERSION: ${{ inputs.version }}
        NU_SHA256: ${{ inputs.sha256 }}
      run: |
        name=nu-$NU_VERSION-x86_64-unknown-linux-gnu
        curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/nushell/nushell/releases/download/$NU_VERSION/$name.tar.gz"
        echo "$NU_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"